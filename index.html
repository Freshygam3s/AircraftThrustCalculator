<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Thrust Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="top">
        <h1>Aircraft Thrust Calculator</h1>
    </div>

    <div class="main-container">
        <div class="calculator">
            <label for="density">Air Density (kg/m³):</label>
            <input type="number" id="density" step="0.01" value="1.225">

            <label for="area">Engine Intake Area (m²):</label>
            <input type="number" id="area" step="0.01" value="1.5">

            <label for="velocity">Aircraft Speed (m/s):</label>
            <input type="number" id="velocity" step="1" value="200">

            <label for="exhaust">Exhaust Velocity (m/s):</label>
            <input type="number" id="exhaust" step="1" value="600">

            <button id="calcBtn">Calculate Thrust</button>

            <h2>Thrust: <span id="output">—</span> N</h2>
        </div>

        <div class="rocket-container">
            <div class="rocket">
                <div class="body"></div>
                <div class="flame"></div>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="thrustChart"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
